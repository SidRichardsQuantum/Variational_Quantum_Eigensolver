name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tests:
    name: fast tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyscf

      - name: Debug environment
        run: |
          python --version
          python -m pip --version
          python -m pip freeze | sed -n '1,200p'

      - name: Run fast tests
        run: |
          pytest -q

  full-tests:
    name: full integration tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyscf

      - name: Debug environment
        run: |
          python --version
          python -m pip --version
          python -m pip freeze | sed -n '1,200p'

      - name: Run full test suite
        run: |
          pytest -q -o addopts=

  numpy2-compat:
    name: NumPy 2 compatibility probe
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true

    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install with NumPy 2 override
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import subprocess
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]
          dependencies = [
              "numpy>=2,<3" if dep.startswith("numpy") else dep
              for dep in project["dependencies"]
          ]
          subprocess.check_call([
              sys.executable, "-m", "pip", "install",
              *dependencies, *project["optional-dependencies"]["dev"],
          ])
          PY
          python -m pip install --no-deps -e .

      - name: Debug environment
        run: |
          python --version
          python -m pip freeze | sed -n '1,200p'

      - name: Run fast tests against NumPy 2
        run: |
          pytest -q
