name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release tag and main ancestry
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_REF"] != f"refs/tags/v{version}":
              raise SystemExit(f"Release must run from tag v{version}, matching pyproject.toml")
          PY
          git merge-base --is-ancestor HEAD origin/main

  lint:
    needs: validate-release
    uses: ./.github/workflows/lint.yml

  tests:
    needs: validate-release
    uses: ./.github/workflows/tests.yml

  package:
    needs: validate-release
    uses: ./.github/workflows/package.yml

  studio:
    needs: validate-release
    uses: ./.github/workflows/studio.yml

  docs:
    needs: validate-release
    uses: ./.github/workflows/docs.yml

  publish-pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, tests, package, studio, docs]

    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Download validated distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
